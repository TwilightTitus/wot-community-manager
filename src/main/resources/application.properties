#application config
application.wot.api-url=https://api.worldoftanks.eu
application.wot.login-url=${application.wot.api-url}/wot/auth/login/
application.external-url=http://localhost:8080
application.session-timeout=3600000
application.allowed-management-roles=ommander,executive_officer,personnel_officer,combat_officer
application.applicationid=
application.clanids=
application.admins=


#rest clients
#quarkus.rest-client.logging.scope=request-response
#quarkus.rest-client.logging.body-limit=50
#quarkus.rest-client.extensions-api.scope=all


#build
quarkus.package.jar.type=uber-jar

#http config
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
quarkus.http.static-resources.caching-enabled=false
%dev.quarkus.http.static-resources.caching-enabled=false

#datasource config
quarkus.datasource.db-kind=postgresql 
#quarkus.datasource.username=
#quarkus.datasource.password=
#quarkus.datasource.jdbc.url=
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.acquisition-timeout=30s

quarkus.hibernate-orm.validation.enabled=false

#flyway config
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/postgresql

# open api
quarkus.swagger-ui.always-include=true

#logging
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%\n

%dev.quarkus.log.level=INFO
%dev.quarkus.log.console.level=INFO

#logger
quarkus.log.category."de.titus.wot.community.manager".level=INFO